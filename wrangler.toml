name = "stocks-mcp"
main = "src/index.ts"
compatibility_date = "2026-06-11"
compatibility_flags = ["nodejs_compat"]

# Only a custom domain (set up in the dashboard) serves the Worker. Every deploy
# keeps the workers.dev URL and preview URLs off. No routes are listed here, so a
# custom domain set up in the dashboard is left as it is.
workers_dev = false
preview_urls = false

[observability]
enabled = true

# Any variables or secrets are managed in the Cloudflare dashboard, not here.
# keep_bindings tells the upload API to keep the existing bindings of these
# types, so a deploy only replaces the code.
[unsafe.metadata]
keep_bindings = ["plain_text", "json", "secret_text", "secret_key"]
